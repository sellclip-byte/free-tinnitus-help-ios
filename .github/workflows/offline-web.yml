name: Deploy Offline Web App
on:
  workflow_dispatch:
  push:
    branches: [ offline-web-gift ]
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact approved web app
        run: |
          mkdir -p site
          unzip -q FreeTinnitusHelp-EXACT-FIXED-PROJECT.zip -d extracted
          WEB="$(find extracted -type d -name Web -print -quit)"
          test -n "$WEB"
          cp -R "$WEB"/. site/
          grep -q "129 Sounds" site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text()
          if 'rel="manifest"' not in s:
              s=s.replace("</head>",'<link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Tinnitus Help"><link rel="apple-touch-icon" href="icon-192.png"></head>')
          p.write_text(s)
          PY
          cat > site/manifest.webmanifest <<'EOF'
          {"name":"Tinnitus Help","short_name":"Tinnitus Help","start_url":"./","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png"},{"src":"icon-512.png","sizes":"512x512","type":"image/png"}]}
          EOF
          python3 - <<'PY'
          from pathlib import Path
          files=[]
          for p in Path("site").rglob("*"):
              if p.is_file() and p.name!="sw.js":
                  files.append("./"+p.relative_to("site").as_posix())
          Path("site/sw.js").write_text("""const CACHE='tinnitus-help-offline-v1';const FILES=%r;self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(FILES)).then(()=>self.skipWaiting())));self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{const copy=resp.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return resp}).catch(()=>caches.match('./index.html')))));""" % files)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html"); s=p.read_text()
          if 'serviceWorker.register' not in s:
              s=s.replace("</body>","<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script></body>")
          p.write_text(s)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
