name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract iPhone source package
        shell: bash
        run: |
       ZIP="FreeTinnitusHelp-v1.30-COLOR-CATALOG-PERSONAL-TONE-PROJECT.zip"        
       if [ -f "$ZIP" ]; then
            mkdir -p build-source
            unzip -q "$ZIP" -d build-source
          else
            echo "Missing $ZIP"
            exit 1
          fi   

      - name: Verify v1.28 project files
        working-directory: build-source
        shell: bash
        run: |
          test -d FreeTinnitusHelp.xcodeproj
          test -f FreeTinnitusHelp/Info.plist
          test -f FreeTinnitusHelp/ContentView.swift
          test -f FreeTinnitusHelp/DtSoundPlayer.swift
          test -f FreeTinnitusHelp/NativeAudioEngine.swift
          test -f FreeTinnitusHelp/Web/index.html

      - name: Compile for iPhone Simulator
        working-directory: build-source
        run: |
          xcodebuild -project FreeTinnitusHelp.xcodeproj \
            -target FreeTinnitusHelp \
            -sdk iphonesimulator \
            -configuration Debug \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/FreeTinnitusHelpSimulator" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload iPhone Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: FreeTinnitusHelp-Simulator
          path: ${{ runner.temp }}/FreeTinnitusHelpSimulator/FreeTinnitusHelp.app
          if-no-files-found: error

      - name: Compile for real iPhone
        working-directory: build-source
        run: |
          xcodebuild -project FreeTinnitusHelp.xcodeproj \
            -target FreeTinnitusHelp \
            -sdk iphoneos \
            -configuration Debug \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/FreeTinnitusHelpDevice" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload unsigned iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: FreeTinnitusHelp-iPhone-Unsigned
          path: ${{ runner.temp }}/FreeTinnitusHelpDevice/FreeTinnitusHelp.app
          if-no-files-found: error
