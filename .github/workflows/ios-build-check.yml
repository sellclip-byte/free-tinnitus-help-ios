name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Extract iPhone source package
        shell: bash
        run: |
          ZIP="DR-Tinnitus-AppStore-FINAL.zip"
          if [ -f "$ZIP" ]; then
            mkdir -p build-source
            unzip -q "$ZIP" -d build-source
          else
            echo "Missing $ZIP"
            exit 1
          fi
          # Overlay the corrected native audio engine maintained at repository root.
          cp NativeAudioEngine.swift build-source/FreeTinnitusHelp/NativeAudioEngine.swift
          # Correct the UI ear labels to the physical output channels on this build.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("build-source/FreeTinnitusHelp/ContentView.swift")
          s=p.read_text()
          s=s.replace('case "pan": NativeAudioEngine.shared.pan=dbl(d,"value",0)', 'case "pan": NativeAudioEngine.shared.pan = -dbl(d,"value",0)')
          p.write_text(s)
          PY

      - name: Verify project files
        working-directory: build-source
        shell: bash
        run: |
          test -d FreeTinnitusHelp.xcodeproj
          test -f FreeTinnitusHelp/Info.plist

      - name: Build Simulator
        working-directory: build-source
        run: |
          xcodebuild \
            -project FreeTinnitusHelp.xcodeproj \
            -scheme FreeTinnitusHelp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/simulator \
            build

      - name: Build iPhone unsigned
        working-directory: build-source
        run: |
          xcodebuild \
            -project FreeTinnitusHelp.xcodeproj \
            -scheme FreeTinnitusHelp \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/iphone \
            build

      - name: Upload Simulator
        uses: actions/upload-artifact@v4
        with:
          name: FreeTinnitusHelp-Simulator
          path: build-source/build/simulator/Build/Products/Debug-iphonesimulator/FreeTinnitusHelp.app

      - name: Package iPhone IPA for AltStore
        working-directory: build-source
        shell: bash
        run: |
          APP="build/iphone/Build/Products/Debug-iphoneos/FreeTinnitusHelp.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null || true)
          if [ -z "$EXECUTABLE" ]; then
            EXECUTABLE="FreeTinnitusHelp"
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string $EXECUTABLE" "$APP/Info.plist"
          fi
          test -f "$APP/$EXECUTABLE"
          rm -rf ipa-package
          mkdir -p ipa-package/Payload
          cp -R "$APP" ipa-package/Payload/DR-Tinnitus.app
          ditto -c -k --sequesterRsrc --keepParent ipa-package/Payload DR-Tinnitus-Ear-Routing-Test.ipa

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: DR-Tinnitus-Ear-Routing-Test-IPA
          path: build-source/DR-Tinnitus-Ear-Routing-Test.ipa
