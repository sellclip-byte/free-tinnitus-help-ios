name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact approved project
        shell: bash
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q FreeTinnitusHelp-EXACT-FIXED-PROJECT.zip -d build-source
          ROOT="$(find build-source -name project.yml -print -quit | xargs dirname)"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          grep -q "129 Sounds" "$ROOT/FreeTinnitusHelp/Web/index.html"
          echo "Exact 129-sound UI verified"

      - name: Generate Xcode project
        shell: bash
        run: |
          cd "$ROOT"
          if [ ! -d FreeTinnitusHelp.xcodeproj ]; then
            brew install xcodegen
            xcodegen generate
          fi
          test -d FreeTinnitusHelp.xcodeproj
          test -f FreeTinnitusHelp/Info.plist
          test -f FreeTinnitusHelp/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Build iPhone unsigned
        shell: bash
        run: |
          cd "$ROOT"
          xcodebuild \
            -project FreeTinnitusHelp.xcodeproj \
            -scheme FreeTinnitusHelp \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/iphone \
            build

      - name: Package IPA
        shell: bash
        run: |
          cd "$ROOT"
          APP="$(find build/iphone/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          rm -rf ipa-package
          mkdir -p ipa-package/Payload
          cp -R "$APP" ipa-package/Payload/FreeTinnitusHelp.app
          cd ipa-package
          zip -qry ../FreeTinnitusHelp-EXACT-FIXED.ipa Payload
          test -s ../FreeTinnitusHelp-EXACT-FIXED.ipa

      - name: Upload exact fixed IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeTinnitusHelp-EXACT-FIXED-IPA
          path: ${{ env.ROOT }}/FreeTinnitusHelp-EXACT-FIXED.ipa
          if-no-files-found: error
