name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact approved project
        shell: bash
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q FreeTinnitusHelp-EXACT-FIXED-PROJECT.zip -d build-source
          ROOT="$(find build-source -name project.yml -print -quit | xargs dirname)"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          grep -q "129 Sounds" "$ROOT/FreeTinnitusHelp/Web/index.html"

      - name: Patch iPhone sound library in extracted project
        shell: bash
        run: |
          cp NativeAudioEngine.swift "$ROOT/FreeTinnitusHelp/NativeAudioEngine.swift"
          cp DtSoundPlayer.swift "$ROOT/FreeTinnitusHelp/DtSoundPlayer.swift"
          python3 - <<'PY'
          import os
          p=os.path.join(os.environ["ROOT"],"FreeTinnitusHelp","Web","index.html")
          s=open(p,encoding="utf-8").read()
          patch=r"""
          <script id="iphone-129-sound-fix-20261001">
          (function(){
            if(!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.nativeAudio))return;
            var H=window.webkit.messageHandlers.nativeAudio;
            function send(action,data){try{H.postMessage(Object.assign({action:action},data||{}))}catch(e){}}
            function defFor(b){var i=Number(b.dataset.idx);return (typeof defs!=="undefined"&&Number.isInteger(i))?defs[i]:null}
            function nativeType(t){
              t=String(t||"sine").toLowerCase();
              var known=["sine","square","buzz","electric","triangle","hum","white","hiss","narrow","widehiss","air","steam","static","crackle","pink","brown","pulse","flutter","warble","waver","metallic","glass","shimmer","dual","fan","jet","engine","cicada","cricket","radio","cloud","highring","softring","whistle","reference"];
              if(known.indexOf(t)>=0)return t;
              if(t.indexOf("whistle")>=0)return "whistle";
              if(t.indexOf("ring")>=0)return "highring";
              if(t.indexOf("buzz")>=0||t.indexOf("electric")>=0)return "electric";
              if(t.indexOf("noise")>=0||t.indexOf("hiss")>=0)return "hiss";
              return "sine";
            }
            document.addEventListener("click",function(e){
              var b=e.target.closest&&e.target.closest("#sounds .sound"); if(!b)return;
              e.preventDefault(); e.stopImmediatePropagation();
              var d=defFor(b); if(!d)return;
              var was=b.dataset.iphonePlaying==="1";
              document.querySelectorAll("#sounds .sound").forEach(function(x){x.dataset.iphonePlaying="0";x.classList.remove("active")});
              send("clear");send("dtStop");
              if(was){send("stop");return}
              var p=d[3]||{}, type=d[2]||"sine", name=String(d[1]||"").toLowerCase();
              if(type==="dtsound"||name==="dt.sound"){
                send("dtPlay");send("dtVolume",{value:Math.max(0,Math.min(1,Number(p.vol||35)/100))});
              }else{
                send("add",{type:nativeType(type),frequency:Number(p.freq||7700),volume:Math.max(0,Math.min(1,Number(p.vol||28)/100)),band:Number(p.band||900),pulse:Number(p.mod||0)});
                send("start");
              }
              b.dataset.iphonePlaying="1";b.classList.add("active");
            },true);
          })();
          </script>
          """
          marker="iphone-129-sound-fix-20261001"
          if marker in s:
              a=s.rfind('<script id="'+marker+'">')
              b=s.find("</script>",a)
              if a>=0 and b>=0: s=s[:a]+s[b+9:]
          # Legacy scripts exist after the historical </html>; append at literal EOF.
          s=s.rstrip()+"\n"+patch+"\n"
          open(p,"w",encoding="utf-8").write(s)
          final=open(p,encoding="utf-8").read()
          assert final.rfind(marker) > final.rfind("native-ios-bridge.js")
          PY

      - name: Generate Xcode project
        shell: bash
        run: |
          cd "$ROOT"
          if [ ! -d FreeTinnitusHelp.xcodeproj ]; then
            brew install xcodegen
            xcodegen generate
          fi
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string FreeTinnitusHelp" FreeTinnitusHelp/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable FreeTinnitusHelp" FreeTinnitusHelp/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" FreeTinnitusHelp/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" FreeTinnitusHelp/Info.plist

      - name: Build and package IPA
        shell: bash
        run: |
          cd "$ROOT"
          xcodebuild -project FreeTinnitusHelp.xcodeproj -scheme FreeTinnitusHelp -sdk iphoneos -configuration Debug CODE_SIGNING_ALLOWED=NO -derivedDataPath build/iphone build
          APP="$(find build/iphone/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          mkdir -p ipa-package/Payload
          cp -R "$APP" ipa-package/Payload/FreeTinnitusHelp.app
          cd ipa-package
          zip -qry ../FreeTinnitusHelp-EXACT-FIXED.ipa Payload

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exact-fixed-ipa
          name: FreeTinnitusHelp EXACT FIXED
          files: ${{ env.ROOT }}/FreeTinnitusHelp-EXACT-FIXED.ipa
          make_latest: true

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTinnitusHelp-EXACT-FIXED-IPA
          path: ${{ env.ROOT }}/FreeTinnitusHelp-EXACT-FIXED.ipa
